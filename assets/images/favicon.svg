<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="#06080B" />
  <rect x="2" y="2" width="60" height="60" rx="12" stroke="#1C2836" stroke-width="1.5" fill="#0B1015" />
  
  <!-- Neon Cyan Lightning Bolt & 24 Motif -->
  <g filter="url(#glow)">
    <!-- Outer Hex / Shield Frame -->
    <polygon points="32,8 54,20 54,44 32,56 10,44 10,20" stroke="#00E5FF" stroke-width="2" fill="none" opacity="0.6" />
    
    <!-- Bold Lightning Bolt Center -->
    <polygon points="35,12 21,34 31,34 27,52 43,28 33,28" fill="#00E5FF" stroke="#FFFFFF" stroke-width="1.2" stroke-linejoin="round" />
  </g>
</svg>
